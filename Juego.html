<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida de Draftosaurus</title>
    <link rel="stylesheet" href="Styles_Base.css"/>
    <link rel="icon" href="imagenes/imgPestaña.png">
</head>
<body class="Partida">

    <header class="barra-superior">
        <!--Este div usuario es la imagen y nombre del usuario junto al boton de ajustes del usuario-->
        <section class="Usuario">
            <img class="img-Usuario" src="imagenes/imgDino.png" alt="Foto del Usuario">
            <aside class="NombreyAjustes">
                <h5 class="nombre-Usuario">Franco123</h5>
                <a href="Ajustes.html" class="ajustes">Ajustes</a>
            </aside>
        </section>   
        <img src="imagenes/Draftosaurusimg.png" alt="Logo Draftosaurus" class="logo-central">
        <img src="imagenes/imgTeknova.png" alt="Logo Teknova" class="logo-teknova">
    </header>

    <main class="Bloque-Dinosaurios">
        <figure class="dinos">
            <img src="imagenes/Dinosaurio_1.png" alt="Dinosaurio-1" class="Dinos">
            <img src="imagenes/Dinosaurio_2.png" alt="Dinosaurio-2" class="Dinos">
            <img src="imagenes/Dinosaurio_3.png" alt="Dinosaurio-3" class="Dinos">
            <img src="imagenes/Dinosaurio_4.png" alt="Dinosaurio-4" class="Dinos">
            <img src="imagenes/Dinosaurio_5.png" alt="Dinosaurio-5" class="Dinos">
            <img src="imagenes/Dinosaurio_6.png" alt="Dinosaurio-6" class="Dinos">
        </figure>
            <!--Contenedor del Mapa y Dado-->
            <article class="contenedor1">
                <figure>
                    <img src="imagenes/gamemap.png" alt="Mapa-del-Juego" class="Mapa-del-Juego">
                </figure>
                <section class="centrado-de-dado">
                    <aside class="DinoDado"></aside>
                    <input class="DinoPuntos" type="text" placeholder="PUNTOS:"></aside>
                </section>
            </article>
    </main>
</body>
</html>
